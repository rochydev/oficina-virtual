<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oficina Virtual</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230a0c1e'/%3E%3Cpath d='M32 13 55 26 32 39 9 26z' fill='%23ff6b4a'/%3E%3Cpath d='M9 26v12l23 13V39z' fill='%23b8432c'/%3E%3Cpath d='M55 26v12L32 51V39z' fill='%23dd5636'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

<header class="top glass">
  <div class="brand">
    <svg class="logo" viewBox="0 0 64 64" width="34" height="34" aria-hidden="true">
      <path d="M32 10 58 24 32 38 6 24z" fill="#ff6b4a"/><path d="M6 24v14l26 14V38z" fill="#b8432c"/><path d="M58 24v14L32 52V38z" fill="#dd5636"/>
      <path class="logo-win" d="M14 32.5v5l6 3.2v-5zM24 37.8v5l5 2.7v-5z" fill="#ffe2a8"/>
    </svg>
    <div class="brand-txt"><span>Oficina</span><b>Virtual</b></div>
    <span class="live" id="liveDot"><i></i><em>En directo</em></span>
  </div>
  <div class="chips" id="chips"></div>
  <div class="tools">
    <span class="clock" id="clock"></span>
    <button id="btnRewind" title="Rebobinar: ver qué pasó antes"><svg viewBox="0 0 24 24"><path d="M11 6 3 12l8 6zM21 6l-8 6 8 6z"/></svg><span>Rebobinar</span></button>
    <button id="btnAway" title="Mostrar también a los que ya se han ido"><svg viewBox="0 0 24 24"><path d="M5 21V4h10v17M3 21h18M15 7h4v14M11 12.5v.01"/></svg><span>Ausentes</span></button>
    <button id="btnMood" title="Ambiente: automático, de día o de noche"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><span id="moodTxt">Auto</span></button>
    <button id="btnSound" class="ico" title="Sonido de los avisos"><svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7 2.5 8h-17C3.500 16 6 15 6 9zM10 20.500a2.200 2.200 0 0 0 4 0"/></svg></button>
    <button id="btnNotify" class="ico" title="Avisos de escritorio aunque tengas otra ventana delante"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></button>
    <button id="btnCine" class="ico" title="Modo cine: solo la oficina (tecla F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button id="btnDemo" class="demo" title="Llenar la oficina con agentes de ejemplo"><svg viewBox="0 0 24 24"><path d="M12 3l1.900 5.600L19.500 10.500l-5.600 1.900L12 18l-1.900-5.600L4.500 10.500l5.600-1.900zM19 16l.800 2.200L22 19l-2.200.800L19 22l-.800-2.200L16 19l2.200-.800z"/></svg><span>Demo</span></button>
  </div>
</header>

<main>
  <section class="stage" id="stage">
    <div class="floor-grid" aria-hidden="true"></div>
    <canvas id="office"></canvas>
    <div class="need-frame" id="needFrame" hidden></div>
    <div class="banner" id="banner" hidden></div>
    <div class="rewind-badge" id="rewindBadge" hidden></div>
    <div class="offline" id="offline" hidden>Sin conexión con el servidor · reintentando…</div>
    <div class="empty glass" id="empty" hidden>
      <h2>La oficina está vacía</h2>
      <p>Ahora mismo no hay ningún agente trabajando. En cuanto abras Claude Code, Codex u Ollama, aparecerán aquí solos.</p>
      <button id="btnDemo2">Ver una demo</button>
    </div>
    <div class="ticker" id="ticker" hidden>
      <h5><i></i>Teletipo</h5>
      <ul id="tickerList"></ul>
    </div>
    <div class="legend" id="legend"></div>
  </section>
  <aside class="side glass" id="side"></aside>
</main>

<footer class="timeline glass" id="timeline" hidden>
  <div class="tl-head">
    <strong>Rebobinar el día</strong>
    <div class="seg" id="tlRange">
      <button data-h="1">1 h</button><button data-h="3" class="on">3 h</button><button data-h="8">8 h</button>
    </div>
    <button id="tlPlay">▶ Reproducir</button>
    <span class="tl-time" id="tlTime">En directo</span>
    <button id="tlLive" class="live-btn">● Volver al directo</button>
    <button id="tlClose" title="Cerrar">✕</button>
  </div>
  <div class="tl-body"><canvas id="tlCanvas"></canvas></div>
</footer>

<div class="toasts" id="toasts"></div>
<div class="grain" aria-hidden="true"></div>

<script src="office.js"></script>
<script src="app.js"></script>
</body>
</html>
